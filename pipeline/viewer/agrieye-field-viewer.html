<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AgriEYE Field Tour</title>
<style>body{margin:0;background:#14251b;color:white;font:16px system-ui}header{padding:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}#pano{height:76vh;width:100%}button,select{padding:10px}#status{padding:12px}.hotspot{border:2px solid white;border-radius:50%;background:#226b3c;color:white;font-size:24px;cursor:pointer}</style>
<header><strong>AgriEYE Field Tour</strong><input id="file" type="file" accept=".json,application/json"><button id="prev" disabled>← Previous</button><select id="select" disabled></select><button id="next" disabled>Next →</button></header><div id="pano"></div><div id="status" role="status">Choose your exported tour JSON. Images stay in this browser; the viewer library requires internet.</div>
<script src="https://cdn.jsdelivr.net/npm/marzipano@0.10.2/dist/marzipano.js"></script><script>
const el=id=>document.getElementById(id);let viewer=null,records=[],active=0,loading=false,generation=0;
function controls(){el('prev').disabled=loading||active===0;el('next').disabled=loading||active===records.length-1;el('select').disabled=loading||!records.length;el('select').value=String(active)}
function dimensions(url){return new Promise((resolve,reject)=>{const image=new Image();image.onload=()=>resolve(image.naturalWidth);image.onerror=()=>reject(Error('Could not decode panorama image.'));image.src=url})}
async function show(index){if(loading||index<0||index>=records.length)return;loading=true;const token=generation;controls();el('status').textContent='Loading panorama…';try{const record=records[index];if(!record.scene){const width=await dimensions(record.data.imageUrl);if(token!==generation)return;const view=new Marzipano.RectilinearView({yaw:0,pitch:0,fov:Math.PI/2},Marzipano.RectilinearView.limit.traditional(width,Math.PI*0.75));record.scene=viewer.createScene({source:Marzipano.ImageUrlSource.fromString(record.data.imageUrl),geometry:new Marzipano.EquirectGeometry([{width}]),view});for(const link of record.data.links||[]){const target=records.findIndex(r=>r.data.id===link.targetId);if(target<0)continue;const b=document.createElement('button');b.className='hotspot';b.textContent='↑';b.title='Go to '+(records[target].data.name||String(target+1));b.onclick=()=>show(target);record.scene.hotspotContainer().createHotspot(b,{yaw:Number(link.yaw)||0,pitch:Number(link.pitch)||0})}}record.scene.switchTo({transitionDuration:500});active=index;el('status').textContent=`Point ${index+1} of ${records.length}: ${record.data.name||record.data.fileName||record.data.id}. `+(record.data.coordinates?'Coordinates present in export.':'No geographic coordinates for this point.');}catch(e){el('status').textContent='Error: '+e.message}finally{if(token===generation){loading=false;controls()}}}
el('file').onchange=async event=>{const file=event.target.files[0];if(!file)return;el('file').disabled=true;try{if(!window.Marzipano)throw Error('Viewer library unavailable. Check internet and reload.');el('status').textContent='Reading JSON…';const data=JSON.parse(await file.text());if(!Array.isArray(data.scenes)||!data.scenes.length)throw Error('Expected a nonempty scenes array.');const ids=new Set();for(const s of data.scenes){if(!s.id||ids.has(s.id)||typeof s.imageUrl!=='string'||!s.imageUrl.startsWith('data:image/'))throw Error('Each scene needs a unique id and an embedded imageUrl.');ids.add(s.id)}generation++;loading=false;if(viewer)viewer.destroy();el('pano').replaceChildren();viewer=new Marzipano.Viewer(el('pano'));records=data.scenes.map(data=>({data,scene:null}));active=0;el('select').replaceChildren();records.forEach((r,i)=>{const o=document.createElement('option');o.value=String(i);o.textContent=r.data.name||r.data.fileName||String(i+1);el('select').appendChild(o)});await show(0)}catch(e){el('status').textContent='Error: '+e.message}finally{el('file').disabled=false}};
el('prev').onclick=()=>show(active-1);el('next').onclick=()=>show(active+1);el('select').onchange=e=>show(Number(e.target.value));
</script></html>
